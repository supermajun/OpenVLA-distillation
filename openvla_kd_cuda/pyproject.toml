[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvla-kd-cuda"
version = "0.1.0"
description = "Single-GPU CUDA full-parameter VLA distillation with FP32 master weights"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.8,<3", "torchvision>=0.23", "transformers==4.51.3",
  "huggingface-hub<1", "pillow", "numpy>=1.26,<2", "h5py", "psutil",
  "safetensors", "accelerate", "sentencepiece", "timm==0.9.16", "pyyaml"
]

[project.optional-dependencies]
test = ["pytest", "imageio"]
report = ["matplotlib"]
teacher = ["diffusers==0.35.2"]
sim = ["robosuite==1.4.1", "mujoco==3.2.7", "bddl==1.0.1", "easydict", "cloudpickle",
       "gym==0.26.2", "opencv-python<4.12", "matplotlib", "imageio", "imageio-ffmpeg", "future"]

[tool.setuptools.packages.find]
include = ["vla_kd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
